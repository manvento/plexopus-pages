name: Plexopus concept browser QA

on:
  push:
    branches:
      - concept/scroll-storytelling-v1
    paths:
      - 'concept/**'
      - '.github/workflows/concept-qa.yml'
  pull_request:
    paths:
      - 'concept/**'
      - '.github/workflows/concept-qa.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser smoke (Chromium responsive)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright for testing only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify pinned scenes, Studio, MCP and responsive layout
        run: node concept/qa/smoke.mjs

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-browser-screenshots
          path: concept/qa/screenshots/
          if-no-files-found: ignore
          retention-days: 7
